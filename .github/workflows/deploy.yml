name: Publish Site

on:
  push:
    branches:
      - main

jobs:
  deploy_client:
    name: Build and Deploy Client
    runs-on: ubuntu-latest
    # test.yml's test job also publishes to the gh-pages branch (the test report,
    # under test-report/); this shared group serializes the two so their pushes to
    # gh-pages never race each other. See test.yml for the other half.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build
        env:
          VITE_API_URL: https://api.cowglow.io

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/
          # Without this, the app's own clean deploy (there's no target-folder here,
          # so it cleans the whole branch root) would delete test.yml's test-report/
          # subfolder on every app deploy.
          clean-exclude: |
            test-report

  deploy_server:
    name: Build and Deploy API to Hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/cowglow/visual-directory-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy compose file and Caddyfile to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: /opt/visual-directory/

      - name: Deploy on Hetzner
        uses: appleboy/ssh-action@v1
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_ORIGIN: ${{ secrets.CLIENT_ORIGIN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,JWT_SECRET,CLIENT_ORIGIN,RESEND_API_KEY,EMAIL_FROM,GHCR_PAT
          script: |
            set -e
            mkdir -p /opt/visual-directory
            cd /opt/visual-directory

            # Write secrets to .env (600 perms so only owner can read)
            cat > .env << EOF
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            JWT_SECRET=${JWT_SECRET}
            CLIENT_ORIGIN=${CLIENT_ORIGIN}
            RESEND_API_KEY=${RESEND_API_KEY}
            EMAIL_FROM=${EMAIL_FROM}
            EOF
            chmod 600 .env

            # Pull latest image and restart
            echo "${GHCR_PAT}" | docker login ghcr.io -u cowglow --password-stdin
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d

            # Run pending migrations
            docker compose -f docker-compose.prod.yml exec -T api pnpm prisma:deploy
